<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Wasm vs JS: Ultimate Physics Battle</title>
    <style>
      body {
        margin: 0;
        background: #0f111a;
        color: #fff;
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      h1 {
        margin: 10px 0 5px 0;
        font-size: 1.6rem;
      }
      p {
        margin: 0 0 20px 0;
        color: #aaa;
        font-size: 0.9rem;
      }
      .container {
        display: flex;
        gap: 30px;
        justify-content: center;
      }
      .side-box {
        background: #161925;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        text-align: center;
      }
      canvas {
        background: #000;
        border-radius: 6px;
        display: block;
      }
      .fps-display {
        font-size: 2.2rem;
        font-weight: bold;
        margin: 10px 0;
      }
      .rust-color {
        color: #00ffcc;
      }
      .js-color {
        color: #ff0055;
      }
      .info-tag {
        font-size: 0.85rem;
        color: #888;
        margin-top: 5px;
      }
    </style>
  </head>
  <body>
    <h1>WebAssembly (Rust) vs JavaScript Physics Collision Load Test</h1>
    <p>
      Particle Count: <span id="count-view">0</span> /
      Both measured with exactly the same calculation algorithm and ultra-fast drawing method
    </p>

    <div class="container">
      <!-- Rust / Wasm エリア -->
      <div class="side-box">
        <h3 class="rust-color">Rust (WebAssembly)</h3>
        <div id="rust-fps" class="fps-display rust-color">0 FPS</div>
        <canvas id="rust-canvas" width="400" height="400"></canvas>
        <div class="info-tag">Calculation: Rust (SIMD/LLVM Optimized)</div>
      </div>

      <!-- Pure JS エリア -->
      <div class="side-box">
        <h3 class="js-color">JavaScript</h3>
        <div id="js-fps" class="fps-display js-color">0 FPS</div>
        <canvas id="js-canvas" width="400" height="400"></canvas>
        <div class="info-tag">Calculation: JS Engine (V8)</div>
      </div>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
